<head>
<meta charset="UTF-8">

     El video de la cámara NUNCA sale del dispositivo: todo se procesa localmente. -->

<title>PANOPTICORE // EXPERIMENTAL SENSOR SUITE</title>
<style>
  :root{
    --green:#00ff6e; --amber:#ffb428; --red:#ff3232; --cyan:#28dcff; --white:#e6ffeb;
    --panel:rgba(0,20,8,.82); --dim:rgba(0,255,110,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"SF Mono","Menlo","Courier New",monospace;color:var(--green);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #fxcanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    image-rendering:pixelated;display:none;}
  #hud{position:absolute;inset:0;width:100%;height:100%;}
  #scanlines{position:absolute;inset:0;pointer-events:none;display:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,255,110,.05) 3px,rgba(0,0,0,.18) 4px);}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.5) 100%);}

  /* telemetry block (PANOPTICORE header) */
  #telemetry{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:6px;z-index:20;
    font-size:8.5px;line-height:1.45;letter-spacing:.3px;white-space:pre;
    background:rgba(0,12,5,.55);padding:4px 6px;border:1px solid rgba(0,255,110,.18);
    text-shadow:0 0 5px rgba(0,255,110,.65);pointer-events:none;max-width:62vw;overflow:hidden;}

  /* mag-track windows */
  .mag{position:absolute;z-index:18;border:1px solid var(--green);background:rgba(0,15,6,.7);
    box-shadow:0 0 12px rgba(0,255,110,.28);display:none;pointer-events:none;}
  .mag .mt{font-size:7.5px;padding:1px 4px;letter-spacing:.4px;background:rgba(0,25,10,.92);
    border-bottom:1px solid var(--dim);white-space:nowrap;overflow:hidden;}
  .mag canvas{display:block;background:#010f06;}
  .mag .mf{font-size:7.5px;padding:1px 4px;letter-spacing:.4px;background:rgba(0,25,10,.92);
    border-top:1px solid var(--dim);color:var(--white);white-space:nowrap;overflow:hidden;}
  .mag .sz{position:absolute;right:2px;bottom:18px;font-size:7px;color:var(--amber);
    border:1px solid rgba(255,180,40,.6);padding:0 2px;background:rgba(0,0,0,.5);}
  #magLock{right:8px;top:calc(env(safe-area-inset-top) + 6px);}
  #magLock canvas{width:158px;height:106px;}
  #mag0{left:8px;top:calc(env(safe-area-inset-top) + 148px);}
  #mag1{right:8px;top:42%;}
  #mag2{left:8px;bottom:calc(env(safe-area-inset-bottom) + 200px);}
  #mag0 canvas,#mag1 canvas,#mag2 canvas{width:118px;height:84px;}

  /* radar (telemetry minimap) */
  #radarwrap{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:25;display:none;}
  #radar{display:block;background:rgba(0,15,6,.8);border:1px solid var(--dim);border-radius:50%;}
  #radarlabel{font-size:8px;text-align:center;margin-top:2px;letter-spacing:1px;color:var(--white);opacity:.85;}

  /* geolog panel */
  #geolog{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:25;display:none;
    border:1px solid var(--dim);background:var(--panel);padding:5px 7px;font-size:8.5px;line-height:1.6;
    white-space:pre;color:var(--white);}
  #geolog .t{color:var(--green);letter-spacing:1px;}

  /* simple bottom bar */
  #simplebar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;
    grid-template-columns:1fr 1fr 1fr auto;gap:6px;
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px) 8px;
    background:linear-gradient(0deg,rgba(0,10,4,.95),rgba(0,10,4,.7) 75%,transparent);}
  button.big{appearance:none;background:rgba(0,40,16,.8);border:1px solid var(--dim);
    color:var(--green);font-family:inherit;font-size:10px;letter-spacing:.8px;line-height:1.3;
    padding:12px 4px;border-radius:2px;text-shadow:0 0 6px rgba(0,255,110,.6);white-space:pre-line;}
  button.big:active{background:rgba(0,255,110,.25);}
  button.big.on{border-color:var(--green);background:rgba(0,255,110,.16);}
  #bAdv{padding:12px 10px;color:var(--amber);border-color:rgba(255,180,40,.5);}

  /* advanced panel */
  #advpanel{position:absolute;left:0;right:0;bottom:0;z-index:35;display:none;
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px) 8px;max-height:70vh;overflow-y:auto;
    background:rgba(0,10,4,.96);border-top:1px solid var(--dim);}
  #advpanel.open{display:block;}
  #btngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;}
  button.ctl{appearance:none;background:rgba(0,40,16,.75);border:1px solid var(--dim);
    color:var(--green);font-family:inherit;font-size:9px;line-height:1.25;letter-spacing:.5px;
    padding:8px 2px;border-radius:2px;text-shadow:0 0 5px rgba(0,255,110,.6);white-space:pre-line;}
  button.ctl:active{background:rgba(0,255,110,.25);}
  button.ctl.on{border-color:var(--green);background:rgba(0,255,110,.18);}
  button.ctl.warn{color:var(--amber);border-color:rgba(255,180,40,.5);}
  button.ctl.danger{color:var(--red);border-color:rgba(255,50,50,.5);}
  .sl{margin:4px 0;}
  .sl label{display:block;font-size:9px;letter-spacing:.5px;color:var(--white);opacity:.9;margin-bottom:2px;}
  .sl input[type=range]{width:100%;height:22px;appearance:none;background:transparent;}
  .sl input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--dim);}
  .sl input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;margin-top:-8px;
    background:#02150a;border:1px solid var(--green);border-radius:2px;box-shadow:0 0 6px rgba(0,255,110,.6);}
  #advclose{width:100%;margin-top:6px;background:rgba(0,60,24,.8);border:1px solid var(--green);
    color:var(--green);font-family:inherit;font-size:10px;padding:9px;letter-spacing:1px;}

  /* report panel */
  #report{position:absolute;inset:0;z-index:40;display:none;background:rgba(0,8,3,.94);
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px) 12px;}
  #report.open{display:flex;flex-direction:column;}
  #reporthead{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--green);
    padding:6px 8px;background:rgba(0,30,12,.6);}
  #reporthead .t{font-size:10px;letter-spacing:1px;text-shadow:0 0 8px rgba(0,255,110,.8);}
  #reportclose{background:rgba(0,60,24,.8);border:1px solid var(--green);color:var(--green);

  #reportbody{flex:1;overflow-y:auto;font-size:9px;line-height:1.65;white-space:pre-wrap;
    border:1px solid var(--dim);border-top:none;padding:8px;color:var(--green);
    text-shadow:0 0 4px rgba(0,255,110,.45);}
  #reportbody .amber{color:var(--amber);}
  #reportbody .cyan{color:var(--cyan);}

  /* boot screen */
  #boot{position:absolute;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
    justify-content:center;align-items:center;padding:24px;text-align:left;}
  #boottext{font-size:11px;line-height:1.75;white-space:pre-wrap;max-width:360px;width:100%;
    text-shadow:0 0 6px rgba(0,255,110,.6);}
  #boottext .sec{color:var(--cyan);}
  #bootbtn{margin-top:24px;background:rgba(0,50,20,.6);border:1px solid var(--green);color:var(--green);
    font-family:inherit;font-size:13px;letter-spacing:2px;padding:14px 26px;
    box-shadow:0 0 16px rgba(0,255,110,.35);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  #booterr{margin-top:14px;color:var(--red);font-size:10px;white-space:pre-wrap;max-width:360px;}
</style>

<script>
"use strict";
/* ============================================================
   PANOPTICORE // EXPERIMENTAL SENSOR SUITE — iPhone web edition
   Inspirado en Kruix-art/MINOS---SIGINT-UFO-Scanner.
   PRIVACIDAD/SEGURIDAD:
   - Todo el procesamiento (movimiento, rastreo, IA) ocurre EN el
     dispositivo. El video de la cámara nunca se envía a ningún lado.
   - Sin cuentas, sin cookies, sin analítica, sin almacenamiento.
   - GPS apagado por defecto; solo se activa con el botón GEOLOG.
   - La CSP de esta página bloquea conexiones externas salvo la
     descarga opcional del modelo de IA (SNAP YOLO).
   ============================================================ */

const $ = id => document.getElementById(id);
const GREEN="#00ff6e", AMBER="#ffb428", RED="#ff3232", CYAN="#28dcff", WHITE="#e6ffeb";

const state = {
  running:false, facing:"environment", mirror:false,
  mode:0, modes:["NORMAL","EDGE","THERMAL","DITHER"],
  flow:true, radar:false, ufo:false, scanlines:false,
  speckle:true, mags:true, autolock:true,
  zoom:1, sens:28, minArea:8, maxPoints:14, retRadius:90, lockRadius:110,
  statusMsg:"RETICLE READY", statusCol:GREEN, statusUntil:0,
  yolo:"IDLE", yoloModel:null, yoloTag:"UNSCANNED", yoloConf:0,
  lockId:null, memory:null,
  frames:0, motionSamples:0, startTime:performance.now(),
  fps:0, fpsCount:0, fpsAt:performance.now(),
  gps:null, gpsWatch:null,
  ori:null, // {hdg,pitch,roll}
  sweep:0,
};

const trackers = [];
let nextTrackId = 1;
let speckles = [];   // [x,y] screen coords of motion cells
const trackLog = [];
function logEvent(txt, cls){
  const t = new Date();
  const hh=String(t.getHours()).padStart(2,"0"), mm=String(t.getMinutes()).padStart(2,"0"), ss=String(t.getSeconds()).padStart(2,"0");
  trackLog.push({t:`${hh}:${mm}:${ss}`, txt, cls:cls||""});
  if(trackLog.length>220) trackLog.shift();
}

/* ---------- boot ---------- */
const bootLines = [
"PANOPTICORE // EXPERIMENTAL SENSOR SUITE",
"MINOS-class build V7.2 · web sensor port",
"",
"[ OK ] micro-motion detector ........... armed",
"[ OK ] kalman track core ............... armed",
"[ OK ] auto mag-track windows .......... armed",
"[ OK ] autolock engine ................. armed",
"[ -- ] neural snap-tagger .............. on demand",
"",
"<sec>SEGURIDAD: todo se procesa en este dispositivo.</sec>",
"<sec>El video nunca sale de tu iPhone. Sin cuentas,</sec>",
"<sec>sin rastreo, sin servidores. GPS apagado por</sec>",
"<sec>defecto (solo con el botón GEOLOG).</sec>",
"",
"awaiting operator authorization for optical sensor",
];
(function typeBoot(){
  const el=$("boottext"); let i=0;
  const iv=setInterval(()=>{
    el.innerHTML = bootLines.slice(0,++i).join("\n")
      .replace(/&/g,"&amp;").replace(/<sec>/g,'<span class="sec">').replace(/<\/sec>/g,"</span>");
    if(i>=bootLines.length){ clearInterval(iv); $("bootbtn").style.display="block"; }
  },80);
})();

/* ---------- camera ---------- */
const video = $("cam");
let stream = null;
async function startCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{
    facingMode: state.facing, width:{ideal:1280}, height:{ideal:720}}});
  video.srcObject = stream;
  await video.play();
}

async function askOrientation(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined" &&
       typeof DeviceOrientationEvent.requestPermission==="function"){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r!=="granted") return;
    }
    window.addEventListener("deviceorientation", e=>{
      state.ori = {
        hdg: e.webkitCompassHeading!=null ? e.webkitCompassHeading : (e.alpha!=null?360-e.alpha:null),
        pitch: e.beta, roll: e.gamma
      };
    });
  }catch(e){/* orientación opcional */}
}

$("bootbtn").addEventListener("click", async ()=>{
  $("booterr").textContent="";
  try{
    await startCamera();
    askOrientation();
    $("boot").style.display="none";
    state.running=true;
    state.startTime=performance.now();
    logEvent("SENSOR ONLINE · OPTICAL FEED ACQUIRED","cyan");
    requestAnimationFrame(loop);
  }catch(e){
    $("booterr").textContent =
      "SENSOR FAULT: " + (e && e.message ? e.message : e) +
      "\n\n· requiere HTTPS y permiso de cámara" +
      "\n· Ajustes > Safari > Cámara > Permitir";
  }
});

/* ---------- canvases ---------- */
const hud=$("hud"), hctx=hud.getContext("2d");
const fx=$("fxcanvas"), fctx=fx.getContext("2d");
const proc=document.createElement("canvas"), pctx=proc.getContext("2d",{willReadFrequently:true});
const radar=$("radar"), rctx=radar.getContext("2d");
const magEls=[ $("mag0"), $("mag1"), $("mag2") ].map(d=>({box:d,
  ctx:d.querySelector("canvas").getContext("2d"),
  title:d.querySelector(".mt"), foot:d.querySelector(".mf")}));
const lockEl={box:$("magLock"), ctx:$("magLock").querySelector("canvas").getContext("2d"),
  foot:$("magLock").querySelector(".mf")};

let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  hud.width=W*DPR; hud.height=H*DPR;
  hud.style.width=W+"px"; hud.style.height=H+"px";
  hctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize); resize();

/* ---------- geometry ---------- */
function coverMap(){
  const vw=video.videoWidth||1280, vh=video.videoHeight||720;
  const scale=Math.max(W/vw,H/vh)*state.zoom;
  return {vw,vh,scale,ox:(W-vw*scale)/2,oy:(H-vh*scale)/2};
}
function vidToScreen(x,y,m){
  let sx=m.ox+x*m.scale, sy=m.oy+y*m.scale;
  if(state.mirror) sx=W-sx;
  return [sx,sy];
}

/* ---------- motion detection ---------- */
const PW=120; let PH=90;
let prevGray=null;
const CELL=4;
function detectMotion(){
  const m=coverMap();
  PH=Math.max(60,Math.round(PW*H/W));
  if(proc.width!==PW||proc.height!==PH){ proc.width=PW; proc.height=PH; prevGray=null; }
  const visW=W/m.scale, visH=H/m.scale;
  const srcX=(m.vw-visW)/2, srcY=(m.vh-visH)/2;
  try{ pctx.drawImage(video,srcX,srcY,visW,visH,0,0,PW,PH); }catch(e){ return []; }
  let img;
  try{ img=pctx.getImageData(0,0,PW,PH); }catch(e){ return []; }
  const d=img.data, n=PW*PH;
  const gray=new Uint8ClampedArray(n);
  for(let i=0;i<n;i++){ const j=i*4; gray[i]=(d[j]*3+d[j+1]*6+d[j+2])/10; }
  if(!prevGray){ prevGray=gray; return []; }
  const thr=state.ufo?Math.max(6,state.sens*0.55):state.sens;
  const cw=Math.ceil(PW/CELL), ch=Math.ceil(PH/CELL);
  const cells=new Uint16Array(cw*ch);
  let total=0;
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const i=y*PW+x;
    if(Math.abs(gray[i]-prevGray[i])>thr){
      cells[((y/CELL)|0)*cw+((x/CELL)|0)]++;
      total++;
    }
  }
  prevGray=gray;
  state.motionSamples+=total;
  const minCell=state.ufo?1:2;
  const active=new Uint8Array(cw*ch);
  for(let i=0;i<cw*ch;i++) active[i]=cells[i]>=minCell?1:0;

  // speckle points: screen position of each active cell (motion "confetti")
  speckles.length=0;
  const px2sx=W/PW*CELL, px2sy=H/PH*CELL;
  for(let cy=0;cy<ch && speckles.length<500;cy++)for(let cx=0;cx<cw;cx++){
    if(active[cy*cw+cx]){
      let sx=(cx+0.5)*px2sx;
      if(state.mirror) sx=W-sx;
      speckles.push([sx,(cy+0.5)*px2sy]);
    }
  }

  const seen=new Uint8Array(cw*ch);
  const boxes=[]; const stack=[];
  for(let cy=0;cy<ch;cy++)for(let cx=0;cx<cw;cx++){
    const idx=cy*cw+cx;
    if(!active[idx]||seen[idx]) continue;
    let minx=cx,maxx=cx,miny=cy,maxy=cy,mass=0;
    stack.length=0; stack.push(idx); seen[idx]=1;
    while(stack.length){
      const c=stack.pop(); const x=c%cw, y=(c/cw)|0;
      mass+=cells[c];
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=cw||ny>=ch) continue;
        const ni=ny*cw+nx;
        if(active[ni]&&!seen[ni]){ seen[ni]=1; stack.push(ni); }
      }
    }
    if(mass<state.minArea) continue;
    const px2s=W/PW;
    const bx=minx*CELL*px2s, by=miny*CELL*(H/PH);
    const bw=(maxx-minx+1)*CELL*px2s, bh=(maxy-miny+1)*CELL*(H/PH);
    boxes.push({x:state.mirror?W-(bx+bw/2):bx+bw/2, y:by+bh/2, w:bw, h:bh, area:mass});
  }
  boxes.sort((a,b)=>b.area-a.area);
  return boxes.slice(0,state.maxPoints+4);
}

/* ---------- tracking ---------- */
function pad3(n){ return String(n).padStart(3,"0"); }
function updateTrackers(boxes){
  const now=performance.now();
  for(const t of trackers){ t.x+=t.vx; t.y+=t.vy; t.matched=false; }
  for(const b of boxes){
    let best=null,bd=1e9;
    for(const t of trackers){
      if(t.matched) continue;
      const dd=(t.x-b.x)**2+(t.y-b.y)**2;
      if(dd<bd){bd=dd;best=t;}
    }
    const R=(best&&best.id===state.lockId)?state.lockRadius:80;
    if(best&&bd<R*R){
      const a=0.45,g=0.12;
      const rx=b.x-best.x, ry=b.y-best.y;
      best.x+=a*rx; best.y+=a*ry; best.vx+=g*rx; best.vy+=g*ry;
      best.vx*=0.92; best.vy*=0.92;
      best.area=b.area; best.w=b.w; best.h=b.h;
      best.age++; best.miss=0; best.matched=true; best.seen=now;
      best.trail.push([best.x,best.y]); if(best.trail.length>18) best.trail.shift();
    } else if(trackers.length<state.maxPoints){
      trackers.push({id:nextTrackId++, x:b.x,y:b.y,vx:0,vy:0,w:b.w,h:b.h,area:b.area,
        age:1,miss:0,matched:true,seen:now,label:null,conf:0,trail:[[b.x,b.y]]});
    }
  }
  for(let i=trackers.length-1;i>=0;i--){
    const t=trackers[i];
    if(!t.matched) t.miss++;
    const limit=t.id===state.lockId?45:14;
    if(t.miss>limit||t.x<-80||t.x>W+80||t.y<-80||t.y>H+80){
      if(t.id===state.lockId){
        state.memory={x:t.x,y:t.y,vx:t.vx,vy:t.vy,area:t.area,since:performance.now(),conf:0.8,label:t.label};
        state.lockId=null;
        setStatus("TARGET MEMORY / SEARCHING 0s CONF 0.80",AMBER);
        logEvent(`TRK-${pad3(t.id)} SIGNAL LOST · MEMORY HOLD X${t.x|0} Y${t.y|0}`,"amber");
      }
      if(t.age>20) logEvent(`TRK-${pad3(t.id)} track end · life ${t.age}f · a${t.area}`);
      trackers.splice(i,1);
    }
  }
  if(state.memory){
    const mem=state.memory;
    mem.x+=mem.vx*0.5; mem.y+=mem.vy*0.5;
    const ageS=(performance.now()-mem.since)/1000;
    mem.conf=Math.max(0,0.8-ageS*0.13);
    let best=null,bd=1e9;
    for(const t of trackers){
      const dd=(t.x-mem.x)**2+(t.y-mem.y)**2;
      if(dd<bd){bd=dd;best=t;}
    }
    if(best&&bd<state.lockRadius*state.lockRadius){
      state.lockId=best.id; best.label=mem.label||best.label;
      state.memory=null;
      setStatus(`ADV LOCK REACQ X${best.x|0} Y${best.y|0} CONF ${(0.6+Math.random()*0.3).toFixed(2)}`,GREEN);
      logEvent(`TRK-${pad3(best.id)} REACQUIRED FROM MEMORY`,"cyan");
    } else if(ageS>6){
      state.memory=null;
      setStatus("TARGET LOST - RETICLE READY",RED);
      logEvent("MEMORY EXPIRED · TARGET LOST","amber");
    } else {
      setStatus(`TARGET MEMORY / SEARCHING ${ageS.toFixed(0)}s CONF ${mem.conf.toFixed(2)}`,AMBER);
    }
  }
  // AUTOLOCK: sin objetivo fijado, engancha solo al track más estable
  if(state.autolock && state.lockId===null && !state.memory){
    let best=null, score=-1;
    for(const t of trackers){
      if(t.age<10) continue;
      const s=t.area*Math.min(t.age,60);
      if(s>score){score=s;best=t;}
    }
    if(best){
      state.lockId=best.id;
      setStatus(`AUTOLOCK ENGAGED TRK-${pad3(best.id)} X${best.x|0} Y${best.y|0}`,GREEN);
      logEvent(`TRK-${pad3(best.id)} AUTOLOCK X${best.x|0} Y${best.y|0} A${best.area}`,"cyan");
    }
  }
}

/* ---------- neural snap tagging ---------- */
async function loadModel(){
  if(state.yoloModel) return state.yoloModel;
  state.yolo="LOADING"; setStatus("YOLO: LOADING",CYAN);
  const load=src=>new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=src; s.crossOrigin="anonymous";
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  try{
    await load("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js");
    await load("https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js");
    state.yoloModel=await cocoSsd.load({base:"lite_mobilenet_v2"});
    state.yolo="READY"; setStatus("YOLO: READY / SNAP ONLY",GREEN);
    return state.yoloModel;
  }catch(e){
    state.yolo="MISSING"; setStatus("YOLO: MODEL MISSING",RED);
    logEvent("NEURAL TAGGER UNAVAILABLE · OFFLINE MODE","amber");
    return null;
  }
}
let snapBusy=false;
$("bSnap").addEventListener("click",async()=>{
  if(snapBusy) return; snapBusy=true;
  $("bSnap").classList.add("on");
  setStatus("YOLO: SNAP QUEUED",CYAN);
  const model=await loadModel();
  if(model){
    try{
      const preds=await model.detect(video,8,0.35);
      const m=coverMap();
      const target=trackers.find(t=>t.id===state.lockId);
      const refX=target?target.x:W/2, refY=target?target.y:H/2;
      let best=null,bd=1e9;
      for(const p of preds){
        const [px,py]=vidToScreen(p.bbox[0]+p.bbox[2]/2,p.bbox[1]+p.bbox[3]/2,m);
        const dd=(px-refX)**2+(py-refY)**2;
        if(dd<bd){bd=dd;best=p;}
      }
      if(best){
        state.yoloTag=best.class.toUpperCase();
        state.yoloConf=best.score;
        if(target){ target.label=state.yoloTag; target.conf=best.score; }
        setStatus(`YOLO SNAP TAGGED: ${state.yoloTag} ${best.score.toFixed(2)}`,GREEN);
        logEvent(`SNAP TAG: ${state.yoloTag} ${best.score.toFixed(2)} · ${preds.length} detections in frame`,"cyan");
      } else {
        state.yoloTag="UNKNOWN"; state.yoloConf=0;
        setStatus("YOLO SNAP: UNKNOWN / IDLE",AMBER);
        logEvent("SNAP RETURNED 0 DETECTIONS");
      }
    }catch(e){ setStatus("YOLO: OFF / SNAP SKIPPED",RED); }
  }
  $("bSnap").classList.remove("on");
  snapBusy=false;
});

/* ---------- FX modes ---------- */
function renderFX(){
  if(state.mode===0) return;
  const fw=180, fh=Math.round(fw*H/W);
  if(fx.width!==fw||fx.height!==fh){ fx.width=fw; fx.height=fh; }
  const m=coverMap();
  const visW=W/m.scale, visH=H/m.scale;
  fctx.save();
  if(state.mirror){ fctx.translate(fw,0); fctx.scale(-1,1); }
  try{ fctx.drawImage(video,(m.vw-visW)/2,(m.vh-visH)/2,visW,visH,0,0,fw,fh); }catch(e){}
  fctx.restore();
  let img; try{ img=fctx.getImageData(0,0,fw,fh); }catch(e){ return; }
  const d=img.data, mode=state.modes[state.mode];
  if(mode==="EDGE"){
    const out=new Uint8ClampedArray(d.length);
    for(let y=1;y<fh-1;y++)for(let x=1;x<fw-1;x++){
      const i=(y*fw+x)*4;
      const gx=d[i+4]-d[i-4], gy=d[i+fw*4]-d[i-fw*4];
      const e=Math.min(255,Math.abs(gx)+Math.abs(gy));
      out[i]=0; out[i+1]=e; out[i+2]=e*0.45; out[i+3]=255;
    }
    img.data.set(out);
  } else if(mode==="THERMAL"){
    for(let i=0;i<d.length;i+=4){
      const v=(d[i]+d[i+1]+d[i+2])/3;
      d[i]=v<128?0:(v-128)*2;
      d[i+1]=v<64?0:v<192?(v-64)*2:255;
      d[i+2]=v<64?v*4:v<128?255-(v-64)*4:0;
    }
  } else if(mode==="DITHER"){
    const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
      const i=(y*fw+x)*4;
      const v=(d[i]+d[i+1]+d[i+2])/3;
      const on=v>(B[y&3][x&3]+0.5)*16;
      d[i]=0; d[i+1]=on?255:8; d[i+2]=on?110:4;
    }
  }
  fctx.putImageData(img,0,0);
}

/* ---------- HUD ---------- */
function drawCorners(x,y,w,h,col,lw){
  const L=Math.min(14,w*0.3);
  hctx.strokeStyle=col; hctx.lineWidth=lw||1.5;
  hctx.beginPath();
  hctx.moveTo(x,y+L);hctx.lineTo(x,y);hctx.lineTo(x+L,y);
  hctx.moveTo(x+w-L,y);hctx.lineTo(x+w,y);hctx.lineTo(x+w,y+L);
  hctx.moveTo(x+w,y+h-L);hctx.lineTo(x+w,y+h);hctx.lineTo(x+w-L,y+h);
  hctx.moveTo(x+L,y+h);hctx.lineTo(x,y+h);hctx.lineTo(x,y+h-L);
  hctx.stroke();
}
function fmtOri(v,suf){ return v==null?"--":(v.toFixed(0)+(suf||"°")); }
function drawHUD(now){
  hctx.clearRect(0,0,W,H);
  hctx.font="9px Menlo, monospace";
  const cx=W/2, cy=H/2;
  const locked=trackers.find(t=>t.id===state.lockId);

  // motion speckles
  if(state.speckle){
    hctx.fillStyle="rgba(0,255,140,.55)";
    for(const s of speckles) hctx.fillRect(s[0]-1,s[1]-1,2,2);
    hctx.fillStyle="rgba(120,255,190,.8)";
    for(let i=0;i<speckles.length;i+=7) hctx.fillRect(speckles[i][0]-1,speckles[i][1]-1,2,2);
  }

  // reticle
  hctx.save();
  hctx.strokeStyle=locked?GREEN:(state.memory?AMBER:"rgba(0,255,110,.6)");
  hctx.lineWidth=1;
  hctx.setLineDash(locked?[]:[5,5]);
  hctx.beginPath(); hctx.arc(cx,cy,state.retRadius*0.4,0,7); hctx.stroke();
  hctx.setLineDash([]);
  hctx.beginPath();
  hctx.moveTo(cx-state.retRadius*0.55,cy); hctx.lineTo(cx-state.retRadius*0.25,cy);
  hctx.moveTo(cx+state.retRadius*0.25,cy); hctx.lineTo(cx+state.retRadius*0.55,cy);
  hctx.moveTo(cx,cy-state.retRadius*0.55); hctx.lineTo(cx,cy-state.retRadius*0.25);
  hctx.moveTo(cx,cy+state.retRadius*0.25); hctx.lineTo(cx,cy+state.retRadius*0.55);
  hctx.stroke();
  hctx.restore();

  // trackers
  for(const t of trackers){
    const isLock=t.id===state.lockId;
    const col=isLock?CYAN:(t.age<4?"rgba(0,255,110,.4)":"rgba(0,255,110,.85)");
    const bw=Math.max(26,t.w), bh=Math.max(26,t.h);
    drawCorners(t.x-bw/2,t.y-bh/2,bw,bh,col,isLock?2:1);
    if(state.flow&&t.trail.length>2){
      hctx.strokeStyle="rgba(40,220,255,.5)"; hctx.lineWidth=1;
      hctx.beginPath(); hctx.moveTo(t.trail[0][0],t.trail[0][1]);
      for(const p of t.trail) hctx.lineTo(p[0],p[1]);
      hctx.stroke();
    }
    hctx.fillStyle=col;
    const tag=t.label?`${t.label} ${(t.conf*100|0)}%`:(isLock?state.yoloTag:`TRACK-${pad3(t.id)}`);
    hctx.fillText(isLock?`LOCK ${tag}`:tag, t.x-bw/2, t.y-bh/2-4);
  }
  // memory ghost
  if(state.memory){
    const mem=state.memory;
    hctx.strokeStyle=AMBER; hctx.setLineDash([4,4]);
    hctx.strokeRect(mem.x-20,mem.y-20,40,40);
    hctx.setLineDash([]);
    hctx.fillStyle=AMBER;
    hctx.fillText("MEMORY",mem.x-20,mem.y-26);
  }

  // status line (below telemetry)
  const showMsg=now<state.statusUntil?state.statusMsg:
    (locked?`ADV LOCK TRK-${pad3(locked.id)} X${locked.x|0} Y${locked.y|0}`:
     state.memory?state.statusMsg:(state.autolock?"AUTOLOCK: SCANNING FIELD":"RETICLE READY"));
  hctx.font="10px Menlo, monospace";
  hctx.fillStyle=now<state.statusUntil?state.statusCol:(locked?GREEN:"rgba(0,255,110,.85)");
  hctx.shadowColor=hctx.fillStyle; hctx.shadowBlur=8;
  const telH=$("telemetry").getBoundingClientRect();
  hctx.fillText(showMsg,8,telH.bottom+16);
  hctx.shadowBlur=0;

  // telemetry text
  const up=(now-state.startTime)/1000;
  const o=state.ori||{};
  const gpsLine=state.gps?`GPS: ${state.gps.latitude.toFixed(5)}, ${state.gps.longitude.toFixed(5)}`:"GPS: OFF";
  $("telemetry").textContent=
`PANOPTICORE // EXPERIMENTAL SENSOR SUITE
MODE: ${state.modes[state.mode]}  RENDER: SAME FRAME
THRESH: ${state.sens}  MIN AREA: ${state.minArea}px  POINTS: ${trackers.length}/${state.maxPoints}
CAM ZOOM: ${state.zoom.toFixed(1)}x  LOCK: ${locked?`X${locked.x|0} Y${locked.y|0} A${locked.area}`:"NONE"}
HDG:${fmtOri(o.hdg)} PITCH:${fmtOri(o.pitch)} ROLL:${fmtOri(o.roll)}
FPS:${state.fps}  T+${up.toFixed(0)}s  LOGS:${trackLog.length}  AUTOLOCK:${state.autolock?"ON":"OFF"}
${gpsLine}  TAG: ${state.yoloTag}
UPLINK: NONE · ON-DEVICE ONLY`;
}

/* ---------- mag-track windows ---------- */
function drawMagWindow(el,t,m,title){
  el.box.style.display="block";
  el.title && (el.title.textContent=title);
  const cw=el.ctx.canvas.width, chh=el.ctx.canvas.height;
  let sx=t.x; if(state.mirror) sx=W-sx;
  const vx=(sx-m.ox)/m.scale, vy=(t.y-m.oy)/m.scale;
  const crop=Math.max(70,Math.max(t.w,t.h)/m.scale*2);
  try{
    el.ctx.save();
    if(state.mirror){ el.ctx.translate(cw,0); el.ctx.scale(-1,1); }
    el.ctx.drawImage(video,vx-crop/2,vy-crop*chh/cw/2,crop,crop*chh/cw,0,0,cw,chh);
    el.ctx.restore();
  }catch(e){}
  // crosshair reticle
  el.ctx.strokeStyle="rgba(0,255,110,.85)"; el.ctx.lineWidth=2;
  el.ctx.beginPath(); el.ctx.arc(cw/2,chh/2,Math.min(cw,chh)*0.18,0,7); el.ctx.stroke();
  el.ctx.beginPath();
  el.ctx.moveTo(cw/2-Math.min(cw,chh)*0.28,chh/2); el.ctx.lineTo(cw/2-Math.min(cw,chh)*0.1,chh/2);
  el.ctx.moveTo(cw/2+Math.min(cw,chh)*0.1,chh/2); el.ctx.lineTo(cw/2+Math.min(cw,chh)*0.28,chh/2);
  el.ctx.moveTo(cw/2,chh/2-Math.min(cw,chh)*0.28); el.ctx.lineTo(cw/2,chh/2-Math.min(cw,chh)*0.1);
  el.ctx.moveTo(cw/2,chh/2+Math.min(cw,chh)*0.1); el.ctx.lineTo(cw/2,chh/2+Math.min(cw,chh)*0.28);
  el.ctx.stroke();
  const z=(crop>0? (Math.max(70,crop)/crop*2):2);
  el.foot.textContent=`X${t.x|0} Y${t.y|0} A${t.area}  Z:${(2).toFixed(1)}x${t.label?"  "+t.label:""}`;
}
let lastMag=0;
function drawMags(now){
  if(!state.mags){ return; }
  if(now-lastMag<200) return;
  lastMag=now;
  const m=coverMap();
  const locked=trackers.find(t=>t.id===state.lockId);
  // big lock window
  if(locked){
    drawMagWindow(lockEl,locked,m,null);
    lockEl.foot.textContent=`X${locked.x|0} Y${locked.y|0} A${locked.area}  TARGET ZOOM:NORMAL${locked.label?"  "+locked.label:""}`;
  } else {
    lockEl.box.style.display=state.autolock?"block":"none";
    if(state.autolock){
      lockEl.ctx.fillStyle="#010f06";
      lockEl.ctx.fillRect(0,0,lockEl.ctx.canvas.width,lockEl.ctx.canvas.height);
      lockEl.ctx.fillStyle="rgba(0,255,110,.6)";
      lockEl.ctx.font="16px Menlo, monospace";
      lockEl.ctx.fillText("AUTOLOCK: SEARCHING",60,110);
      lockEl.foot.textContent="SEARCHING…";
    }
  }
  // top tracks (excluding lock)
  const tops=[...trackers].filter(t=>t.id!==state.lockId&&t.age>=8).sort((a,b)=>b.area-a.area).slice(0,3);
  magEls.forEach((el,i)=>{
    const t=tops[i];
    if(!t){ el.box.style.display="none"; return; }
    el.trackRef=t;
    drawMagWindow(el,t,m,`AUTO MAG-TRACK // TRACK-${pad3(t.id)}`);
  });
}
/* yellow connector lines drawn on hud after mags (positions cached) */
function drawConnectors(){
  if(!state.mags) return;
  hctx.strokeStyle="rgba(255,210,60,.55)"; hctx.lineWidth=1;
  const locked=trackers.find(t=>t.id===state.lockId);
  const pairs=[];
  if(locked&&lockEl.box.style.display==="block") pairs.push([lockEl.box,locked]);
  magEls.forEach(el=>{
    if(el.box.style.display==="block"&&el.trackRef&&trackers.includes(el.trackRef))
      pairs.push([el.box,el.trackRef]);
  });
  for(const [box,t] of pairs){
    const r=box.getBoundingClientRect();
    hctx.beginPath();
    hctx.moveTo(t.x,t.y);
    hctx.lineTo(r.left+r.width/2,r.top+r.height/2);
    hctx.stroke();
    hctx.strokeStyle="rgba(255,210,60,.55)";
  }
}

/* ---------- radar ---------- */
function drawRadar(now){
  if(!state.radar) return;
  const R=58,c=R;
  rctx.clearRect(0,0,116,116);
  rctx.strokeStyle="rgba(0,255,110,.5)";
  for(const rr of [R-1,R*0.66,R*0.33]){
    rctx.beginPath(); rctx.arc(c,c,rr,0,7); rctx.stroke();
  }
  rctx.beginPath(); rctx.moveTo(c,2); rctx.lineTo(c,114); rctx.moveTo(2,c); rctx.lineTo(114,c);
  rctx.strokeStyle="rgba(0,255,110,.2)"; rctx.stroke();
  state.sweep=(now/900)%(Math.PI*2);
  rctx.save();
  rctx.translate(c,c); rctx.rotate(state.sweep);
  const g=rctx.createLinearGradient(0,0,R,0);
  g.addColorStop(0,"rgba(0,255,110,.35)"); g.addColorStop(1,"rgba(0,255,110,0)");
  rctx.fillStyle=g;
  rctx.beginPath(); rctx.moveTo(0,0); rctx.arc(0,0,R-1,-0.5,0); rctx.closePath(); rctx.fill();
  rctx.restore();
  let sig=0;
  for(const t of trackers){
    const bx=c+(t.x/W-0.5)*2*R*0.9, by=c+(t.y/H-0.5)*2*R*0.9;
    rctx.fillStyle=t.id===state.lockId?AMBER:GREEN;
    rctx.beginPath(); rctx.arc(bx,by,t.id===state.lockId?3:2,0,7); rctx.fill();
    sig+=t.area;
  }
  $("radarlabel").textContent=`RADAR · BLIPS ${trackers.length} · SIG ${Math.min(9.99,sig/400).toFixed(2)}`;
}

/* ---------- main loop ---------- */
let frameToggle=0;
function loop(now){
  if(!state.running) return;
  state.frames++;
  state.fpsCount++;
  if(now-state.fpsAt>1000){
    state.fps=state.fpsCount; state.fpsCount=0; state.fpsAt=now;
  }
  frameToggle^=1;
  if(frameToggle&&video.readyState>=2){
    const boxes=detectMotion();
    updateTrackers(boxes);
  }
  renderFX();
  drawHUD(now);
  drawMags(now);
  drawConnectors();
  drawRadar(now);
  requestAnimationFrame(loop);
}

setInterval(()=>{
  if(!state.running) return;
  for(const t of trackers){
    if(t.age>0&&t.age%120===0){
      logEvent(`TRK-${pad3(t.id)} ${t.label||"UNSCANNED"} · X${t.x|0} Y${t.y|0} v${Math.hypot(t.vx,t.vy).toFixed(1)} · life ${t.age}f`);
    }
  }
},1000);
</script>
